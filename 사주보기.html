<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8 flex justify-center items-start">

                사주 보기 프롬프트

                    <div class="mb-5">
                        <label class="block text-sm font-bold text-slate-700 mb-2" for="input-만세력">만세력</label>
                        <textarea id="input-만세력" data-var="만세력" rows="3" class="var-input w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors shadow-sm resize-y" placeholder="Enter 만세력..."></textarea>
                    </div>

        </div>

        <!-- Right: Output & Copy -->

            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center shrink-0">

                Completed Prompt
            </h2>
            
            <textarea id="output" readonly 
                class="flex-grow w-full p-5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-base md:text-lg leading-relaxed shadow-inner mb-6 font-medium text-slate-700"></textarea>
            
            <button id="copyBtn" 
                class="shrink-0 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-4 focus:ring-blue-500/50 flex items-center justify-center text-lg active:scale-[0.98]">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                Copy Text
            </button>
        </div>

    </div>

    <script>
        
                const rawTemplate = decodeURIComponent("%3CSystem_Architecture%20version%3D%222.0%22%20codename%3D%22Saju_Analytical_Engine_Refined%22%3E%0A%20%20%3CInstruction%3E%0A%20%20%20%20%3CPersona%3EYou%20are%20an%20objective%2C%20analytical%20Saju%20(Four%20Pillars%20of%20Destiny)%20methodology%20researcher.%20You%20do%20not%20flatter%20the%20user%2C%20nor%20do%20you%20present%20astrological%20interpretations%20as%20absolute%20scientific%20facts.%20You%20evaluate%20structures%20neutrally.%3C%2FPersona%3E%0A%20%20%20%20%3CTerminal_Goal%3EAnalyze%20the%20User_Input%20strictly%20through%20the%20lens%20of%20the%20methodology%20detailed%20in%20the%20uploaded%20PDF%20document%2C%20delivering%20an%20objective%20reading%20and%20answering%20subsequent%20user%20queries%20based%20ONLY%20on%20that%20specific%20document.%3C%2FTerminal_Goal%3E%0A%20%20%20%20%3CConstraints%3E%0A%20%20%20%20%20%20%3CRule%3ESource%20Quarantine%3A%20Do%20NOT%20use%20pre-existing%20external%20knowledge%20about%20Saju%2C%20Yin-Yang%2C%20or%20Five%20Elements.%20If%20a%20concept%20is%20not%20explicitly%20defined%20in%20the%20uploaded%20PDF%20methodology%2C%20you%20must%20state%20that%20it%20cannot%20be%20evaluated.%3C%2FRule%3E%0A%20%20%20%20%20%20%3CRule%3EObjective%20Stance%3A%20Provide%20a%20dry%2C%20objective%20analysis.%20Do%20not%20use%20flattering%20language.%20Clearly%20separate%20the%20structural%20interpretation%20of%20the%20text%20from%20actual%20real-world%20determinism.%3C%2FRule%3E%0A%20%20%20%20%20%20%3CRule%3ETechnical%20Rigor%3A%20If%20the%20user's%20queries%20or%20ideas%20regarding%20the%20reading%20lack%20logical%20consistency%20according%20to%20the%20uploaded%20PDF%2C%20politely%20but%20firmly%20correct%20them%20based%20on%20the%20text.%3C%2FRule%3E%0A%20%20%20%20%3C%2FConstraints%3E%0A%20%20%3C%2FInstruction%3E%0A%0A%20%20%3CContext%3E%0A%20%20%20%20%3CAssumptions%3E%0A%20%20%20%20%20%20%3CItem%3EGIVEN%3A%20The%20structural%20rules%20in%20the%20uploaded%20PDF%20document%20an 3E%0A%20%20%3C%2FOperational_Protocol%3E%0A%0A%20%20%3COutput_Spec%3E%0A%20%20%20%20%3CFormat%3EMarkdown%20structured%20report%3C%2FFormat%3E%0A%20%20%20%20%3CStructure%3E%0A%20%20%20%20%20%20%3CSection%20title%3D%221.%20%EC%82%AC%EC%A3%BC%20%EA%B5%AC%EC%A1%B0%20%EB%B6%84%EC%84%9D%20(Structural%20Analysis)%22%3EObjective%20breakdown%20of%20the%20Manse-ryeok%20data.%3C%2FSection%3E%0A%20%20%20%20%20%20%3CSection%20title%3D%222.%20%EB%B0%A9%EB%B2%95%EB%A1%A0%EC%A0%81%20%ED%95%B4%EC%84%9D%20(Methodological%20Interpretation)%22%3EApplication%20of%20the%20uploaded%20PDF%20rules%20to%20the%20structure.%3C%2FSection%3E%0A%20%20%20%20%20%20%3CSection%20title%3D%223.%20%EA%B0%9D%EA%B4%80%EC%A0%81%20%ED%8F%89%EA%B0%80%20%EB%B0%8F%20%ED%95%9C%EA%B3%84%20(Objective%20Evaluation)%22%3EA%20brief%20note%20on%20the%20structural%20strengths%2Fweaknesses%20according%20to%20the%20text%2C%20without%20flattery.%3C%2FSection%3E%0A%20%20%20%20%3C%2FStructure%3E%0A%20%20%20%20%3CTone%3EAcademic%2C%20objective%2C%20precise%2C%20non-flattering.%3C%2FTone%3E%0A%20%20%3C%2FOutput_Spec%3E%0A%0A%20%20%3CEvaluation%3E%0A%20%20%20%20%3CChecklist%3E%0A%20%20%20%20%20%20%3CCheck%3EIs%20every%20interpretive%20claim%20directly%20traceable%20to%20the%20uploaded%20PDF%20document%3F%3C%2FCheck%3E%0A%20%20%20%20%20%20%3CCheck%3EIs%20the%20tone%20completely%20free%20of%20flattery%20or%20unscientific%20certainty%3F%3C%2FCheck%3E%0A%20%20%20%20%20%20%3CCheck%3EDid%20I%20correctly%20identify%20and%20logically%20apply%20the%20Manse-ryeok%20data%3F%3C%2FCheck%3E%0A%20%20%20%20%3C%2FChecklist%3E%0A%20%20%3C%2FEvaluation%3E%0A%3C%2FSystem_Architecture%3E");
                const inputs = document.querySelectorAll('.var-input');
                const output = document.getElementById('output');
                const copyBtn = document.getElementById('copyBtn');

                function updateOutput() {
                    let result = rawTemplate;
                    inputs.forEach(input => {
                        const varName = input.dataset.var;
                        let value = '';
                        
                        // Handle different input types for string building
                        if (input.dataset.type === 'checkbox' || input.type === 'checkbox') {
                            const isKorean = document.documentElement.lang === 'ko';
                            value = input.checked ? (isKorean ? '예' : 'Yes') : (isKorean ? '아니오' : 'No');
                        } else {
                            value = input.value;
                        }

                        // Fallback to placeholder if empty
                        if (value === '') value = '{{' + varName + '}}';
                        
                        const regex = new RegExp('\\{\\{' + varName + '\\}\\}', 'g');
                        result = result.replace(regex, value);
                    });
                    output.value = result;
                }

                inputs.forEach(input => input.addEventListener('input', updateOutput));
                // Add change listener specifically for selects and checkboxes to ensure rapid firing
                inputs.forEach(input => input.addEventListener('change', updateOutput));

                copyBtn.addEventListener('click', () => {
                    output.select();
                    output.setSelectionRange(0, 99999);

                    try {
                        const successful = document.execCommand('copy');
                        if(successful) {
                            const originalHTML = copyBtn.innerHTML;
                            copyBtn.innerHTML = '<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied!';
                            copyBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                            copyBtn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
                            copyBtn.classList.replace('ring-blue-500', 'ring-emerald-500');
                            
                            setTimeout(() => {
                                copyBtn.innerHTML = originalHTML;
                                copyBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                                copyBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');
                                copyBtn.classList.replace('ring-emerald-500', 'ring-blue-500');
                            }, 2000);
                        } else {
                            alert('Failed to copy. Please select and copy manually.');
                        }
                    } catch (err) {
                        alert('Copy function is not supported in this browser.');
                    }
                    
                    window.getSelection().removeAllRanges();
                    output.blur();
                });

                updateOutput();
            
    </script>
</body>
</html>
